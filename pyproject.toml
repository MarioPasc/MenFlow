[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "menflow"
version = "0.1.0"
description = "MenFlow — volume-steerable latent flow matching for meningioma growth forecasting"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = [
    "meningioma",
    "MRI",
    "flow-matching",
    "latent-diffusion",
    "medical-imaging",
    "MAISI",
]
authors = [
    {name = "Mario Pascual-González", email = "mpascual@uma.es"},
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    # I/O and arrays
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
    "pandas>=2.1",
    "nibabel>=5.1",
    "SimpleITK>=2.3",
    "openpyxl>=3.1",
    # DL stack — broad version ranges so the same pyproject works on a local
    # workstation and inside an NGC-based Singularity container on Picasso.
    # Driver-CUDA matching is an *install-time* concern, not a Python-level
    # dependency. Install patterns:
    #
    #   • Local RTX 3060 (driver 535 / CUDA 12.2 → cu121 wheels):
    #       pip install -e . --extra-index-url https://download.pytorch.org/whl/cu121
    #
    #   • Local RTX 4060 / similar (driver 545+ / CUDA 12.4):
    #       pip install -e . --extra-index-url https://download.pytorch.org/whl/cu124
    #
    #   • Picasso A100 inside an NGC Singularity image (torch already provided):
    #       pip install -e . --no-deps          # then install non-torch deps:
    #       pip install h5py monai>=1.3 ...     # everything else
    #     Or, inside an Apptainer recipe, simply add MenFlow as the last layer
    #     without touching the NGC torch install:
    #       %post
    #         pip install --no-deps -e /opt/MenFlow
    #
    # Hard-pinning torch broke us once when pip silently upgraded an NGC-shipped
    # torch and rebroke the cuDNN/NCCL linkage; do not re-tighten without a
    # specific compatibility reason.
    "torch>=2.2,<3",
    "monai>=1.3,<2",
    # Metrics for E1
    "torchmetrics>=1.3",
    "lpips>=0.1.4",
    "piq>=0.8",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    # Statistical pipeline (E1 §7)
    "pwlf>=2.2",
    "statsmodels>=0.14",
    # Visualization
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Utilities
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.92",
    "ruff>=0.3",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.8",
    "pre-commit>=3.6",
]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]

[project.urls]
Homepage = "https://github.com/MarioPasc/MenFlow"
Documentation = "https://github.com/MarioPasc/MenFlow#readme"
Repository = "https://github.com/MarioPasc/MenFlow"
"Bug Tracker" = "https://github.com/MarioPasc/MenFlow/issues"
Changelog = "https://github.com/MarioPasc/MenFlow/releases"

[project.scripts]
menflow-convert-brats-men = "menflow.data.conversors.brats_men:cli"
menflow-convert-mengrowth = "menflow.data.conversors.mengrowth:cli"
menflow-encode = "routines.encode.cli:main"
menflow-decode = "routines.decode.cli:main"
menflow-compute-features = "routines.compute_features.cli:main"
menflow-e1 = "experiments.maisi_autoencoder_patology_preservation.cli:main"
menflow-e2-1 = "experiments.E2_1_recoverability.cli:main"
menflow-e2-2 = "experiments.E2_2_identifiability.cli:main"
menflow-e2-3 = "experiments.E2_3_spatial_localization.cli:main"
menflow-steer-decode = "routines.steer_decode.cli:main"
menflow-e2-4 = "experiments.E2_4_causal_steering.cli:main"
menflow-segment-brats = "routines.segment_brats.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "slow: tests that touch real datasets on disk",
    "integration: end-to-end conversion tests",
]

[tool.pyright]
extraPaths = ["src"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["menflow*", "routines*", "experiments*"]

[tool.setuptools.package-data]
menflow = ["py.typed", "config/*.yaml", "config/**/*.yaml"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "monai.*",
    "yaml",
    "pandas",
    "SimpleITK.*",
    "matplotlib.*",
    "seaborn.*",
    "numpy.*",
    "nibabel.*",
    "h5py.*",
    "pwlf.*",
    "lpips.*",
    "piq.*",
    "skimage.*",
    "statsmodels.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
