# 2-step dry run — boots the engine, exercises identity-at-init, runs 2 grad
# accumulation cycles, validates once, saves, and exits. Use to debug plumbing
# before launching the 200-step smoke.

fm_checkpoint: /media/mpascual/Sandisk2TB/research/menflow/checkpoints/NV-Generate-MR/models/diff_unet_3d_rflow-mr.pt
latent_h5: /media/mpascual/MeningD2/MAISI_VAEGAN_LATENTS/BRATS_MEN/brats_men_maisi_latents.h5
features_h5_dir: /media/mpascual/MeningD2/MAISI_VAEGAN_LATENTS/BRATS_MEN/per_modality_features
output_dir: /media/mpascual/Sandisk2TB/research/menflow/runs/finetune_fm_volume

run_name: dry_run_3060
modalities: [t1c]
log_level: INFO

train:
  batch_size: 1
  grad_accum: 2
  max_steps: 2
  lr: 1.0e-4
  weight_decay: 1.0e-2
  warmup_steps: 1
  p_uncond: 0.1
  grad_clip: 1.0
  ema_decay: 0.9999
  seed: 42
  num_workers: 0
  val_interval: 2
  sample_interval: 100
  save_interval: 2
  autocast_dtype: float16
  activation_checkpointing: false

lora:
  rank: 4
  alpha: 4.0
  dropout: 0.0
  target_modules: [to_q, to_k, to_v, out_proj]
  bias: none

conditioner:
  fourier_features: 32
  fourier_sigma: 1.0
  embed_dim: 256
  hidden_dim: 256

sampling:
  n_anchors: 1
  log_v_grid: [0.0]
  n_ode_steps: 4
  cfg_scale: 4.0
