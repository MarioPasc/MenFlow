# MAISI-v2 decode routine — default config.
#
# By default the source H5 path is read from the latent file's attrs; override
# with `source_h5:` if the file has moved.

latent_h5: /media/mpascual/MeningD2/MENINGIOMAS/BRATS_MEN/h5/brats_men_maisi_latents.h5
output_h5: /media/mpascual/MeningD2/MENINGIOMAS/BRATS_MEN/h5/brats_men_maisi_recon.h5
checkpoint: /media/mpascual/Sandisk2TB/research/menflow/checkpoints/NV-Generate-MR/models/autoencoder_v2.pt
source_h5: null

max_scans: null
output_dtype: float32
compression_level: 4
log_level: INFO

device: cuda
dtype: float32

# Architecture must match what produced the latents. Defaults mirror the rflow
# MR config in NV-Generate-CTMR.
model:
  spatial_dims: 3
  in_channels: 1
  out_channels: 1
  num_res_blocks: [2, 2, 2]
  num_channels: [64, 128, 256]
  attention_levels: [false, false, false]
  latent_channels: 4
  norm_num_groups: 32
  norm_eps: 1.0e-6
  with_encoder_nonlocal_attn: false
  with_decoder_nonlocal_attn: false
  use_checkpointing: false
  use_convtranspose: false
  num_splits: 4
  dim_split: 1
  norm_float16: true
  save_mem: true
