# MAISI-v2 decode — MenGrowth on Picasso A100.

latent_h5: /mnt/home/users/tic_163_uma/mpascual/fscratch/datasets/MenGrowth/latents/mengrowth_maisi_latents.h5
output_h5: /mnt/home/users/tic_163_uma/mpascual/fscratch/datasets/MenGrowth/recon/mengrowth_maisi_recon.h5
checkpoint: /mnt/home/users/tic_163_uma/mpascual/fscratch/checkpoints/NV-Generate-MR/models/autoencoder_v2.pt
source_h5: /mnt/home/users/tic_163_uma/mpascual/fscratch/datasets/MenGrowth/h5_format/MenGrowth_MenFlow.h5

max_scans: null
output_dtype: float32
compression_level: 4
log_level: INFO
device: cuda
dtype: float16

model:
  spatial_dims: 3
  in_channels: 1
  out_channels: 1
  num_res_blocks: [2, 2, 2]
  num_channels: [64, 128, 256]
  attention_levels: [false, false, false]
  latent_channels: 4
  norm_num_groups: 32
  norm_eps: 1.0e-6
  with_encoder_nonlocal_attn: false
  with_decoder_nonlocal_attn: false
  use_checkpointing: false
  use_convtranspose: false
  num_splits: 4
  dim_split: 1
  norm_float16: true
  save_mem: true

slurm:
  job_name: menflow_decode_mengrowth
  partition: dgx
  constraint: dgx
  time: "0-02:00:00"
  cpus_per_task: 16
  mem: 64G
  gres: "gpu:1"
  conda_env: menflow
  repo_dir: /mnt/home/users/tic_163_uma/mpascual/fscratch/repos/MenFlow
  logs_dir: /mnt/home/users/tic_163_uma/mpascual/execs/menflow/logs
