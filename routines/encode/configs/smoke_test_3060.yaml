# Smoke-test config: 1 scan, 1 modality, downscaled to 128^3.
# Target hardware: RTX 3060 12 GB.

source_h5: /media/mpascual/MeningD2/MENINGIOMAS/BRATS_MEN/h5/brats_men.h5
output_h5: /tmp/menflow_smoke_latents.h5
checkpoint: /media/mpascual/Sandisk2TB/research/menflow/checkpoints/NV-Generate-MR/models/autoencoder_v2.pt

modalities: [t1c]
max_scans: 1

latent_dtype: float32
compression_level: 4
log_level: INFO

model:
  spatial_dims: 3
  in_channels: 1
  out_channels: 1
  num_res_blocks: [2, 2, 2]
  num_channels: [64, 128, 256]
  attention_levels: [false, false, false]
  latent_channels: 4
  norm_num_groups: 32
  norm_eps: 1.0e-6
  with_encoder_nonlocal_attn: false
  with_decoder_nonlocal_attn: false
  use_checkpointing: false
  use_convtranspose: false
  num_splits: 4
  dim_split: 1
  norm_float16: true
  save_mem: true

inference:
  device: cuda
  # MAISI-v2 MR was trained with `norm_float16=True`, which casts GroupNorm
  # outputs to fp16 unconditionally. Running the rest of the network in fp32
  # produces a Conv3d input/bias dtype mismatch, so we use fp16 throughout —
  # also fits the 3060's 12 GB budget more comfortably.
  dtype: float16
  deterministic: true
  pad_multiple: 16
  pad_mode: reflect
  target_spatial_shape: [128, 128, 128]
  intensity_lower_percentile: 0.0
  intensity_upper_percentile: 99.5
  intensity_b_min: 0.0
  intensity_b_max: 1.0
  intensity_clip: false
