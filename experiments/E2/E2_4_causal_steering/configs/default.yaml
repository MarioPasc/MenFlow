# E2.4 — causal steering experiment (template).
# All routine fields below are passed through to SteerDecodeRoutineConfig;
# experiment-only fields are listed at the end.

latents_h5: null
source_h5: null
direction_npz: null
checkpoint: null
output_dir: null

modality: t1c
modality_index: 0
operator: local
deltas: [-1.5, -1.0, -0.5, 0.0, 0.5, 1.0, 1.5]
mask_dilation_radius: 0
n_anchors_per_bin: 1
volume_bin_edges_log_cm3: [-2.3, -0.5, 0.7, 1.5, 2.3, 4.5]
splits_to_use: ["val"]
mask_label_set: [1, 2, 3]
dtype: float16
device: cuda
seed: 0
save_decoded_nifti: true
save_steered_latents: false
intensity_rescale: true

# Experiment-level options:
mode: analyze_only             # "full" forces a re-decode; "analyze_only" reuses sweep_results.h5
write_phase_a_report: true
log_level: INFO
