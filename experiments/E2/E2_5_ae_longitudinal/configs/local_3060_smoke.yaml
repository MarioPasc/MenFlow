# E2.5 smoke — 3 patients, t1c only, no null baseline. Targets ~5-10 min on 4060.

unified_h5: /media/mpascual/MeningD2/MENINGIOMAS/MENGROWTH/050526/h5_format/MenGrowth_MenFlow.h5
latents_h5: /media/mpascual/MeningD2/MAISI_VAEGAN_LATENTS/MENGROWTH/mengrowth_maisi_latents.h5
maisi_checkpoint: /media/mpascual/Sandisk2TB/research/menflow/checkpoints/NV-Generate-MR/models/autoencoder_v2.pt

e2_1_direction_npz:
  t1c: /media/mpascual/Sandisk2TB/research/menflow/experiments/E2/E2_1_recoverability/per_modality/t1c/direction.npz

modalities: [t1c]
mask_label_set: [1, 2, 3]

# Cohort — relaxed to surface a triple from the limited MenGrowth dataset.
min_timepoints: 3
min_log_volume_spread: 0.3
min_log_volume_spread_relaxed: [0.2, 0.1]
min_effective_cohort: 3
max_patients: 3

# Diagnostic
beta_grid_size: 11
anatomy_beta_grid: [0.0, 0.25, 0.5, 0.75, 1.0]
use_segmenter_dice: false
mask_dilation_voxels: 2

# Null baseline disabled in smoke
n_null_triples: 0
null_random_seed: 42

# Bootstrap small for smoke
n_bootstrap_resamples: 200
bootstrap_ci_alpha: 0.05
bootstrap_seed: 0

# Hardware
device: cuda
decode_dtype: float16
skip_decode: false
num_splits: 4  # matches encode-time MAISI config; cuDNN now available

output_dir: /media/mpascual/Sandisk2TB/research/menflow/experiments/E2/E2.5_ae_longitudinal/smoke
n_qualitative_panel_patients: 3
log_level: INFO
