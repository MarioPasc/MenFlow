# E2.1 — Volume Recoverability default config. Override paths per-machine.

features_h5: null   # required: features H5 produced by routines/compute_features
output_dir: null    # required: where to write result.json + figures

mode: full           # smoke | subset | full
subset_n: 50
bootstrap_n: 1000
n_splits: 5

mlp_max_epochs: 200
mlp_hidden: 256
mlp_dropout: 0.1
mlp_lr: 0.001
mlp_weight_decay: 0.0001
mlp_patience: 20
mlp_batch_size: 64

ridge_alphas: [0.1, 1.0, 10.0, 100.0]
seed: 0
device: cpu
log_level: INFO
